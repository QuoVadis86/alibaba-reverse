[project]
name = "alibaba-international-sdk"
version = "0.1.0"
description = "Read-only SDK for observed Alibaba.com product endpoints"
requires-python = ">=3.11"
dependencies = ["httpx2[http2,brotli,zstd]>=2.16,<3", "pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alibaba_international"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
