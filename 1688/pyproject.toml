[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mtop-1688"
version = "0.1.0"
description = "用于调用 1688 MTOP 商品接口的 Python SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "requests>=2.32,<3.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
mtop-1688 = "mtop_sdk.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtop_sdk*"]
